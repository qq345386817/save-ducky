        <h1>Save Ducky 隱私政策</h1>
        <p>Save Ducky 是一款本地解謎遊戲。它不需要帳號，也不需要連線才能遊玩。</p><h2>資料收集</h2><p>正常遊玩時，App 不收集帳號資訊、玩法檔案或個人雲端資料。</p><h2>可選麥克風與語音功能</h2><p>可選聲音控制可能請求麥克風和語音辨識權限。這些權限只用於你主動開啟的本地控制功能。</p><h2>聯絡</h2><p>隱私問題請聯絡 cameoshell09@gmail.com。</p>

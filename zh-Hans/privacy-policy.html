        <p>Save Ducky 是一款本地解谜游戏。它不需要账号，也不需要联网才能游玩。</p><h2>数据收集</h2><p>正常游玩时，App 不收集账号信息、玩法档案或个人云端数据。</p><h2>可选麦克风与语音功能</h2><p>可选声音控制可能请求麦克风和语音识别权限。这些权限只用于你主动开启的本地控制功能。</p><h2>联系</h2><p>隐私问题请联系 cameoshell09@gmail.com。</p>
